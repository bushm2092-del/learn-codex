name: learn-codex
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://learn:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/learn?sslmode=disable
    HTTP_ADDR: :8080
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4173}
    GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/api/v1/auth/github/callback}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    GIN_MODE: release
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: learn
      POSTGRES_DB: learn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U learn -d learn]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  pgdata:
