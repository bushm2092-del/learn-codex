[workspace]
members = [
    "crates/app-server",
    "crates/app-server-protocol",
    "crates/arg0",
    "crates/config",
    "crates/core",
    "crates/model-provider-info",
    "crates/models-manager",
    "crates/protocol",
    "crates/utils/home-dir",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
dotenvy = "0.15"
eventsource-stream = "0.2"
pretty_assertions = "1"
tempfile = "3"
toml = "0.9"
toml_edit = "0.24"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
