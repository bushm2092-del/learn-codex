[workspace]
members = [
    "crates/app-server",
    "crates/app-server-protocol",
    "crates/arg0",
    "crates/config",
    "crates/core",
    "crates/features",
    "crates/model-provider-info",
    "crates/model-provider",
    "crates/models-manager",
    "crates/protocol",
    "crates/shell-command",
    "crates/tools",
    "crates/utils/home-dir",
    "crates/utils/pty",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bm25 = "=2.3.2"
indexmap = "2.12.0"
dirs = "6"
dotenvy = "0.15"
eventsource-stream = "0.2"
pretty_assertions = "1"
tempfile = "3"
toml = "0.9"
toml_edit = "0.24"
futures = "0.3"
libc = "0.2.182"
portable-pty = "0.9.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
which = "8"
