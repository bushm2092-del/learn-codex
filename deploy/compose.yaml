name: ${COMPOSE_PROJECT_NAME:-learn-codex-site}
x-api: &api
  image: learn-codex-api:${RELEASE_TAG:?missing release metadata}
  pull_policy: never
  platform: ${RELEASE_PLATFORM:?missing release platform}
  environment:
    DATABASE_URL: postgres://learn:${POSTGRES_PASSWORD:?set database password}@postgres:5432/learn?sslmode=disable
    HTTP_ADDR: :8080
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set public origin}
    GITHUB_CALLBACK_URL: ${FRONTEND_ORIGIN}/api/v1/auth/github/callback
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    GIN_MODE: release
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: learn-codex-postgres:${RELEASE_TAG}
    pull_policy: never
    platform: ${RELEASE_PLATFORM}
    environment:
      POSTGRES_USER: learn
      POSTGRES_DB: learn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U learn -d learn]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logs
  migrate:
    <<: *api
    command: [migrate]
    profiles: [tools]
    restart: "no"
  api:
    <<: *api
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  frontend:
    image: learn-codex-frontend:${RELEASE_TAG}
    pull_policy: never
    platform: ${RELEASE_PLATFORM}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logs
volumes:
  pgdata:
